# Exercises the gateway discriminator, its ACM certificate union arm, and the gateway-level router.
type: gateway
name: inference-gateway
default: true
backend: aws
region: us-east-1
instance_type: t3.small
router:
  type: sglang
  policy: round_robin
domain: example.com
public_ip: false
certificate:
  type: acm
  arn: arn:aws:acm:us-east-1:123456789012:certificate/abc123
replicas: 2
tags:
  env: prod
