# Sugared forms a user actually types. Every one of these depends on a `pre=True` validator or
# on number->str coercion, so this file is the highest-value parse input in the suite.
type: task
commands:
  - echo hi
python: 3.10          # a YAML float, not a string
nodes: 2
max_duration: 2h
idle_duration: off
resources:
  cpu: 2..8
  memory: 16GB..
  gpu: A100:2
  disk: 100GB..
env:
  - A=1
  - B                 # no value -> EnvSentinel
